<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baskervville+SC&family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="section"></div>
        <div class="section"></div>
        <div class="section"></div>
    </div>
    <h2>Business Card Generator</h2>
    <form id="businessForm">
        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="business type" placeholder="Business Type">
        <input type="text" id="contact" placeholder="Contact Details">
        <input type="file" id="imageUpload" accept="image/*">
    </form>

    <div class="card">
        <img id="cardImage" src="" alt="Profile Picture" style="display: none;">
        <h3 id="cardName">Your Name</h3>
        <p id="cardBusiness">Business Type</p>
        <p id="cardContact">Contact Details</p>
    </div>
<script src="index.js"></script>
</body>
</html>
